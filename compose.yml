services:
  site:
    image: public.ecr.aws/docker/library/ruby:4.0.7
    working_dir: /site
    command: bundle exec jekyll serve --host 0.0.0.0 --baseurl /dev --livereload --force_polling
    ports:
      - "127.0.0.1:4000:4000"
      - "127.0.0.1:35729:35729"
    volumes:
      - .:/site
      - gems:/usr/local/bundle

volumes:
  gems:
